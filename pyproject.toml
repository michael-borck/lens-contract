[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lens-contract"
version = "0.1.0"
description = "The shared contract surface for the lens analyser family — manifest builder + FastAPI/CLI scaffolding every member exposes."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Michael Borck" }]
# Per CONVENTIONS.md, fastapi/uvicorn/python-multipart are *core* to the contract
# (every member's `serve` + HTTP API are always available). rich is intentionally
# NOT here: human-readable CLI output is bespoke per analyser, not part of the
# contract surface.
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/lens_contract"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
